# Streamlit's own theme, set to match the design so the app looks right
# even in the split second before our stylesheet loads.
[theme]
base = "light"
primaryColor = "#15171A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F5"
textColor = "#15171A"
font = "sans serif"

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false
